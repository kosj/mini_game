<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사다리 타기</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪜</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <a class="home" href="/">🎮 미니게임</a>
    <h1>🪜 사다리 타기</h1>
  </header>

  <main>
    <!-- 1. 방 만들기 -->
    <section id="view-create" class="view hidden">
      <div class="card">
        <label for="purpose">무엇을 정하는 사다리인가요?</label>
        <input id="purpose" type="text" maxlength="80" placeholder="예) 오늘 커피 사는 사람 정하기" />

        <label for="count">참가 인원</label>
        <div class="count-row">
          <button type="button" class="count-btn" data-delta="-1">−</button>
          <span id="count-display">4</span>
          <button type="button" class="count-btn" data-delta="1">+</button>
        </div>

        <label>결과 항목 (사다리 아래에 배치됩니다)</label>
        <div id="result-inputs"></div>

        <button id="btn-create" class="primary">사다리 만들기</button>
        <p id="create-error" class="error"></p>
      </div>
    </section>

    <!-- 2. 대기실: 위치 선택 -->
    <section id="view-lobby" class="view hidden">
      <div class="card">
        <p class="purpose-label">이번 사다리의 목적</p>
        <h2 id="lobby-purpose"></h2>

        <div class="invite-box">
          <span id="invite-link"></span>
          <button id="btn-copy" type="button">복사</button>
        </div>
        <p class="hint">친구들에게 초대 링크를 공유하세요. 모두 위치를 고르면 자동으로 시작됩니다!</p>

        <label for="my-name">내 이름</label>
        <input id="my-name" type="text" maxlength="16" placeholder="이름을 입력하고 위치를 선택하세요" />

        <p id="lobby-progress" class="progress"></p>
        <div id="slot-grid" class="slot-grid"></div>
        <p id="lobby-error" class="error"></p>
      </div>
    </section>

    <!-- 3. 게임: 사다리 애니메이션 -->
    <section id="view-game" class="view hidden">
      <div class="card game-card">
        <h2 id="game-purpose"></h2>
        <div id="countdown" class="countdown hidden"></div>
        <div id="ladder-wrap">
          <div id="top-labels" class="labels"></div>
          <svg id="ladder-svg" preserveAspectRatio="xMidYMid meet"></svg>
          <div id="bottom-labels" class="labels"></div>
        </div>
        <div id="result-panel" class="result-panel hidden">
          <h3>🎉 결과</h3>
          <ul id="result-list"></ul>
          <a class="primary link-btn" href="/ladder/">새 사다리 만들기</a>
        </div>
      </div>
    </section>

    <!-- 방 없음 / 오류 -->
    <section id="view-notfound" class="view hidden">
      <div class="card center">
        <h2>😥 방을 찾을 수 없어요</h2>
        <p class="hint">링크가 잘못되었거나 만료된 방입니다. (방은 24시간 동안 유지됩니다)</p>
        <a class="primary link-btn" href="/ladder/">새 사다리 만들기</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
